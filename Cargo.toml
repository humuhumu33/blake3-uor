[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# The certified packages LexLean exports are dependencies, not members: their
# bytes are LexLean's, so `cargo fmt` and `clippy` must not judge them.
exclude = ["export"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raise this when something here needs a newer compiler; nothing does yet.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
# Instantiated repositories set their own URLs here.
repository = "https://github.com/humuhumu33/blake3-uor"
homepage = "https://github.com/humuhumu33/blake3-uor"
authors = ["UOR Foundation"]
keywords = []
categories = []

[workspace.dependencies]
repo-model = { version = "0.1.0", path = "crates/model" }
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
repo-conformance = { version = "0.1.0", path = "crates/conformance" }
# The production roots of `lexlean/src/Blake3.lex.tex`, as LexLean exports them
# (`lexlean production build --request lexlean/production-request.json`).
blake3_hash = { version = "0.1.0", path = "export/rust-std/blake3_hash" }
blake3_hash_hex = { version = "0.1.0", path = "export/rust-std/blake3_hash_hex" }
blake3_keyed_hash = { version = "0.1.0", path = "export/rust-std/blake3_keyed_hash" }
blake3_derive_key = { version = "0.1.0", path = "export/rust-std/blake3_derive_key" }
blake3_hash_pieces = { version = "0.1.0", path = "export/rust-std/blake3_hash_pieces" }
blake3_trace_file = { version = "0.1.0", path = "export/rust-std/blake3_trace_file" }
blake3_trace_address = { version = "0.1.0", path = "export/rust-std/blake3_trace_address" }
# Phase 2 (`lexlean production build --request lexlean-slice/production-request.json`).
blake3_slice_of = { version = "0.1.0", path = "export/rust-std/blake3_slice_of" }
blake3_slice_check = { version = "0.1.0", path = "export/rust-std/blake3_slice_check" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The differential hashes about 12 MB through the exported packages and the
# oracle; unoptimized, that alone takes minutes.
[profile.dev.package.blake3_hash]
opt-level = 3
[profile.dev.package.blake3_hash_hex]
opt-level = 3
[profile.dev.package.blake3_keyed_hash]
opt-level = 3
[profile.dev.package.blake3_derive_key]
opt-level = 3
[profile.dev.package.blake3_hash_pieces]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.blake3_trace_file]
opt-level = 3
[profile.dev.package.blake3_trace_address]
opt-level = 3
[profile.dev.package.blake3_slice_of]
opt-level = 3
[profile.dev.package.blake3_slice_check]
opt-level = 3
