[package]
name = "blake3-check"
description = "Differential evidence for the LexLean BLAKE3 export: the official vectors, the blake3 crate on a seeded corpus, and throughput."
# Evidence, not product. The product is the certified packages under
# `export/rust-std/`, generated by LexLean from `lexlean/src/Blake3.lex.tex`.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The blake3 crate restricted to its portable implementation (no SIMD, no
# assembly), for the throughput comparison only. The differential tests pass
# under both builds.
portable = ["blake3/no_sse2", "blake3/no_sse41", "blake3/no_avx2", "blake3/no_avx512", "blake3/no_neon"]

[dependencies]
blake3_hash = { workspace = true }
blake3_hash_hex = { workspace = true }
blake3_keyed_hash = { workspace = true }
blake3_derive_key = { workspace = true }
blake3_hash_pieces = { workspace = true }
# The oracle. Its version is the release whose test vectors are committed in
# `oracles/blake3-1.8.7/`.
blake3 = "=1.8.7"
serde_json = "1"
# The provenance records name package files by sha256.
sha2 = "0.10"

[lints]
workspace = true
