spec = "lexlean/project/1"
name = "blake3-uor-trace"
language = "1.2"
module_prefix = "Blake3UorTrace"
source_roots = ["src"]
entrypoints = ["src/Blake3Trace.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[source_package]]
package = "blake3"
version = "1.0.0"
kind = "path"
path = "lexlean"

[[source_package]]
package = "std"
version = "1.0.0"
kind = "path"
path = "vendor/lexlean-stdlib"

[limits]
max_file_bytes = 16777216
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 3600000
