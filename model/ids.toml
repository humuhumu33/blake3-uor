# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The model behind every row is `lexlean/src/Blake3.lex.tex` (generated by
# `tools/gen_blake3.py`); the rows are claims about that model's certified
# Rust export under `export/rust-std/`.

spec = "template/1"

[[id]]
id = "B3-01"
level = "build"
suite = "blake3"
statement = "The exported packages reproduce all 35 cases of the official BLAKE3 1.8.7 test vectors in hash, keyed_hash and derive_key modes, 131 bytes of extended output each, and the 32-byte digest as lowercase hex."

[[id]]
id = "B3-02"
level = "build"
suite = "blake3"
statement = "The exported packages equal the blake3 crate 1.8.7 in all three modes on a seeded corpus whose lengths cover every block, chunk and tree boundary from 0 to 102400 bytes, at output lengths from 0 to 1031 bytes."

[[id]]
id = "B3-03"
level = "build"
suite = "blake3"
statement = "Incremental hashing (start, one update per piece, finalize) equals one-shot hashing for every tested split of every corpus input, in all three modes."

[[id]]
id = "B3-04"
level = "build"
suite = "blake3"
statement = "A keyed-hash key that is not 32 bytes is refused as Blake3Error.keyLength carrying its length, by keyedHash and by hashPieces."

[[id]]
id = "B3-05"
level = "build"
suite = "blake3"
statement = "The committed packages are the ones verified LexLean builds exported: each package file hashes to its provenance record, each package names the semantic identity its project's attestation verified, and the core attestation records all sixteen kernel theorems with exactly the axioms Quot.sound and propext."

[[id]]
id = "B3-06"
level = "build"
suite = "blake3"
statement = "The trace the certified traceFile writes records, in its root blob, the digest BLAKE3 computes and the input's ADR-015 DigestSet, and the trace's address is that root blob's DigestSet, in all three modes."

[[id]]
id = "B3-07"
level = "build"
suite = "blake3"
statement = "Every DigestSet in a trace, at every level, equals BLAKE3 and SHA-256 of its blob as the blake3 and sha2 crates compute them, and every label a blob names belongs to a blob before it."

[[id]]
