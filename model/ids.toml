level = "build"
suite = "blake3"
statement = "checkTrace rejects a flipped operation result, a flipped carry bit, a wrong permutation index, a reordered step, a wrong flag with its label kept or relabelled, a changed checkpoint with its label kept, and a forged parent link, each as the TraceError that names it; another input's trace is not this input's address."

[[id]]
id = "B3-10"
level = "build"
suite = "blake3"
statement = "The same mode, input and output length give byte-identical traces, however the input is split into updates."

[[id]]
