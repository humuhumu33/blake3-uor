# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R2).
#
# The conformance IDs and their levels live in `model/ids.toml`, which is the
# register; duplicating them here would give a claim two sources, which is
# exactly what R1 forbids. What remains is the two kinds of claim that have no
# ID: the facts this repository *reproduces* from an authority, and the
# quantities it *measures* and never asserts.
#
# The meta-gate proves the suite never asserts an `open` claim as established,
# and `CM-03` proves every `some-true` row cites an authority that exists.
#
spec = "template/1"

[[claim]]
id = "AUTH-BLAKE3-VECTORS"
level = "some-true"
statement = "The official BLAKE3 test vectors are the outputs of BLAKE3 as specified."
authority = "AUTH-BLAKE3"

[[claim]]
id = "OPEN-B3-THROUGHPUT"
level = "open"
statement = "Single-thread throughput of the exported blake3_hash package against the blake3 crate's portable and SIMD builds, as reported by `cargo run --release -p blake3-check --bin throughput` in docs/blake3-verification.md."

[[claim]]
id = "OPEN-B3-PRISM-IMAGE"
level = "open"
statement = "A local Prism image of prism/Blake3Image.lex.tex (the core, the stdlib Sha256 and the trace module in one file), built and checked with the prism-browser-runtime tooling outside this repository, as reported in docs/blake3-verification.md."

[[claim]]
id = "OPEN-B3-TRACE-SIZES"
level = "open"
statement = "Sizes of the serialised trace at the tree, word and bit levels for 64 B, 1 KiB and 1 MiB inputs, as reported by `cargo run --release -p blake3-check --bin trace_sizes` in docs/blake3-verification.md."

[[claim]]
id = "AUTH-LEXLEAN-STDLIB-SHA256"
level = "some-true"
statement = "LexLean's stdlib Sha256 computes FIPS 180-4 SHA-256; the trace's sha256 DigestSet axis rests on it."
authority = "AUTH-LEXLEAN-STDLIB"
